<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f7f9ff">
<title>Movie Finder</title>
<style>
*{
    box-sizing:border-box;
}
html{
    scroll-behavior:smooth;
}
body{
    margin:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f5f7fc;
    color:#182033;
}
/* HEADER */
header{
    background:linear-gradient(135deg,#ffffff,#edf3ff);
    border-bottom:1px solid #e1e7f2;
    padding:28px 18px 38px;
}
.nav{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}
.logo{
    font-size:25px;
    font-weight:900;
    color:#315efb;
}
.nav-right{
    display:flex;
    gap:8px;
}
.nav-btn{
    border:0;
    background:white;
    color:#34415c;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    box-shadow:0 3px 12px rgba(30,50,90,.06);
}
.nav-btn.active{
    background:#315efb;
    color:white;
}
.hero{
    max-width:950px;
    margin:45px auto 0;
    text-align:center;
}
.hero h1{
    font-size:clamp(32px,6vw,58px);
    margin:0;
    letter-spacing:-2px;
}
.hero h1 span{
    color:#315efb;
}
.hero p{
    color:#6e7890;
    font-size:16px;
    margin:14px auto 25px;
    max-width:650px;
}
/* SEARCH */
.search-area{
    max-width:850px;
    margin:auto;
}
.search-box{
    background:white;
    padding:8px;
    border-radius:18px;
    display:flex;
    gap:8px;
    box-shadow:0 12px 35px rgba(35,65,120,.13);
}
.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    padding:15px;
    font-size:16px;
    background:transparent;
}
.search-btn{
    border:0;
    background:#315efb;
    color:white;
    border-radius:13px;
    padding:0 24px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}
.search-btn:hover{
    background:#244bd5;
}
/* FILTER */
.container{
    max-width:1250px;
    margin:auto;
    padding:28px 18px 60px;
}
.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}
select{
    border:1px solid #dce3ef;
    background:white;
    padding:12px 14px;
    border-radius:12px;
    color:#27334a;
    outline:0;
    cursor:pointer;
}
.result-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}
.result-info h2{
    margin:0;
    font-size:21px;
}
.count{
    color:#7b8497;
    font-size:14px;
}
/* MOVIES */
.movies{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(175px,1fr));
    gap:20px;
}
.movie{
    background:white;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 6px 22px rgba(35,55,95,.08);
    cursor:pointer;
    transition:transform .2s,box-shadow .2s;
    position:relative;
}
.movie:hover{
    transform:translateY(-7px);
    box-shadow:0 14px 35px rgba(35,55,95,.15);
}
.poster-wrap{
    position:relative;
    aspect-ratio:2/3;
    background:#e8edf6;
}
.poster{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.rating{
    position:absolute;
    left:9px;
    top:9px;
    background:rgba(255,255,255,.94);
    padding:6px 8px;
    border-radius:9px;
    font-size:12px;
    font-weight:900;
    color:#8a6800;
}
.save{
    position:absolute;
    right:9px;
    top:9px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    cursor:pointer;
    font-size:17px;
    z-index:2;
}
.save.saved{
    color:#315efb;
}
.movie-info{
    padding:13px;
}
.movie-title{
    font-weight:850;
    line-height:1.3;
    font-size:15px;
}
.movie-meta{
    color:#7c8698;
    margin-top:6px;
    font-size:13px;
}
.genre{
    color:#315efb;
    margin-top:7px;
    font-size:12px;
    font-weight:700;
}
/* EMPTY */
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 15px;
    color:#778197;
}
.empty-icon{
    font-size:48px;
    margin-bottom:10px;
}
/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,28,45,.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:18px;
}
.modal.show{
    display:flex;
}
.modal-card{
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    position:relative;
    padding:26px;
}
.close{
    position:absolute;
    right:17px;
    top:17px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#eef2f8;
    font-size:22px;
    cursor:pointer;
}
.detail{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:28px;
    padding-top:5px;
}
.detail-poster{
    width:100%;
    border-radius:16px;
    display:block;
}
.detail h2{
    font-size:31px;
    margin:5px 50px 8px 0;
}
.detail-meta{
    color:#6e7890;
    font-size:14px;
}
.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:16px 0;
}
.tag{
    padding:7px 10px;
    background:#edf2ff;
    color:#315efb;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
}
.detail h3{
    margin:20px 0 7px;
}
.detail p{
    color:#626e82;
    line-height:1.7;
    margin-top:5px;
}
.watch-btn{
    border:0;
    background:#315efb;
    color:white;
    padding:12px 17px;
    border-radius:11px;
    font-weight:800;
    cursor:pointer;
}
.watch-btn.saved{
    background:#e9efff;
    color:#315efb;
}
/* WATCHLIST */
.watchlist{
    display:none;
}
.watchlist.show{
    display:block;
}
.main-content.hide{
    display:none;
}
footer{
    text-align:center;
    padding:30px;
    color:#8a94a7;
    font-size:13px;
}
/* MOBILE */
@media(max-width:650px){
    header{
        padding-top:20px;
    }
    .nav{
        align-items:flex-start;
    }
    .logo{
        font-size:21px;
    }
    .nav-btn{
        padding:9px 10px;
        font-size:12px;
    }
    .hero{
        margin-top:35px;
    }
    .hero h1{
        letter-spacing:-1px;
    }
    .search-box{
        flex-direction:column;
    }
    .search-btn{
        padding:14px;
    }
    .movies{
        grid-template-columns:repeat(2,1fr);
        gap:13px;
    }
    .movie-info{
        padding:10px;
    }
    .movie-title{
        font-size:14px;
    }
    .detail{
        grid-template-columns:1fr;
    }
    .detail-poster{
        width:190px;
        margin:auto;
    }
    .detail h2{
        font-size:25px;
    }
}
</style>
</head>

<header>
    <div class="nav">
        <div class="logo">
            🎬 Movie Finder
        </div>
        <div class="nav-right">
            <button
                class="nav-btn active"

                🏠 Home
            </button>

                ❤️ Watchlist
            </button>
        </div>
    </div>
    <div class="hero">
        <h1>
            Find your next
            <span>movie.</span>
        </h1>
        <p>
            Cari film favoritmu dari database lokal.
            Tidak membutuhkan API atau API key.
        </p>
        <div class="search-area">
            <div class="search-box">
                <input
                    id="search"
                    type="search"
                    placeholder="Cari judul film..."
                    autocomplete="off">
                <button
                    class="search-btn"
                    onclick="searchMovies()">
                    🔎 Cari
                </button>
            </div>
        </div>
    </div>
</header>
<div class="container">
    <div class="main-content" id="mainContent">
        <div class="filters">
            <select id="genreFilter" onchange="applyFilters()">
                <option value="all">Semua Genre</option>
            </select>
            <select id="yearFilter" onchange="applyFilters()">
                <option value="all">Semua Tahun</option>
            </select>
            <select id="ratingFilter" onchange="applyFilters()">
                <option value="all">Semua Rating</option>
                <option value="9">9+</option>
                <option value="8">8+</option>
                <option value="7">7+</option>
                <option value="6">6+</option>
            </select>
            <select id="sortFilter" onchange="applyFilters()">
                <option value="popular">Terpopuler</option>
                <option value="rating">Rating Tertinggi</option>
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="az">A → Z</option>
            </select>
        </div>
        <div class="result-info">
            <h2 id="sectionTitle">
                🎬 Koleksi Film
            </h2>
            <div
                class="count"
                id="count">
                0 film
            </div>
        </div>
        <div
            class="movies"
            id="movies">
        </div>
    </div>
    <div
        class="watchlist"
        id="watchlist">
        <div class="result-info">
            <h2>
                ❤️ Watchlist Saya
            </h2>
            <div
                class="count"
                id="watchCount">
                0 film
            </div>
        </div>
        <div
            class="movies"
            id="watchMovies">
        </div>
    </div>
</div>
<footer>
    Movie Finder • Local Database • No API Required
</footer>
<div
    class="modal"
    id="modal"
    onclick="closeOutside(event)">
    <div class="modal-card">
        <button
            class="close"
            onclick="closeModal()">
            ×
        </button>
        <div id="detail"></div>
    </div>
</div>

description:"Sebuah keluarga mencoba menyelesaikan berbagai masalah hubungan ketika anak-anak mereka mulai menjalani kehidupan masing-masing."
},
{
id:100,
title:"Keluarga Cemara",
year:2019,
genre:["Drama","Family"],
rating:7.8,
duration:"110 menit",
director:"Yandy Laurens",
cast:"Ringgo Agus Rahman, Nirina Zubir",
description:"Sebuah keluarga harus beradaptasi dengan kehidupan baru setelah mengalami perubahan ekonomi yang besar."
}
];
/* =========================================================
   STATE
   ========================================================= */
let currentMovies = [...movies];
let watchlist =
    JSON.parse(
        localStorage.getItem("movie_watchlist") || "[]"
    );
/* =========================================================
   INIT
   ========================================================= */
function init(){
    createGenreFilter();
    createYearFilter();
    renderMovies(currentMovies);
    document
        .getElementById("search")
        .addEventListener("keydown",function(e){
            if(e.key === "Enter"){
                searchMovies();
            }
        });
}
/* =========================================================
   FILTER OPTIONS
   ========================================================= */
function createGenreFilter(){
    const genres = [
        ...new Set(
            movies.flatMap(movie => movie.genre)
        )
    ].sort();
    const select =
        document.getElementById("genreFilter");
    genres.forEach(genre => {
        const option =
            document.createElement("option");
        option.value = genre;
        option.textContent = genre;
        select.appendChild(option);
    });
}
function createYearFilter(){
    const years = [
        ...new Set(
            movies.map(movie => movie.year)
        )
    ].sort((a,b) => b-a);
    const select =
        document.getElementById("yearFilter");
    years.forEach(year => {
        const option =
            document.createElement("option");
        option.value = year;
        option.textContent = year;
        select.appendChild(option);
    });
}
/* =========================================================
   SEARCH
   ========================================================= */
function searchMovies(){
    applyFilters();
}
/* =========================================================
   FILTER + SORT
   ========================================================= */
function applyFilters(){
    const query =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();
    const genre =
        document.getElementById("genreFilter").value;
    const year =
        document.getElementById("yearFilter").value;
    const rating =
        document.getElementById("ratingFilter").value;
    const sort =
        document.getElementById("sortFilter").value;
    currentMovies =
        movies.filter(movie => {
            const matchesSearch =
                !query ||
                movie.title
                    .toLowerCase()
                    .includes(query) ||
                movie.genre.some(g =>
                    g.toLowerCase().includes(query)
                ) ||
                movie.cast
                    .toLowerCase()
                    .includes(query);
            const matchesGenre =
                genre === "all" ||
                movie.genre.includes(genre);
            const matchesYear =
                year === "all" ||
                String(movie.year) === String(year);
            const matchesRating =
                rating === "all" ||
                movie.rating >= Number(rating);
            return (
                matchesSearch &&
                matchesGenre &&
                matchesYear &&
                matchesRating
            );
        });
    if(sort === "rating"){
        currentMovies.sort(
            (a,b) => b.rating - a.rating
        );
    }
    else if(sort === "newest"){
        currentMovies.sort(
            (a,b) => b.year - a.year
        );
    }
    else if(sort === "oldest"){
        currentMovies.sort(
            (a,b) => a.year - b.year
        );
    }
    else if(sort === "az"){
        currentMovies.sort(
            (a,b) =>
                a.title.localeCompare(b.title)
        );
    }
    else{
        currentMovies.sort(
            (a,b) => b.rating - a.rating
        );
    }
    const title =
        query
        ? `🔎 Hasil untuk "${escapeHtml(query)}"`
        : "🎬 Koleksi Film";
    document
        .getElementById("sectionTitle")
        .textContent = title;
    renderMovies(currentMovies);
}
/* =========================================================
   RENDER MOVIES
   ========================================================= */
function renderMovies(list){
    const box =
        document.getElementById("movies");
    box.innerHTML = "";
    document
        .getElementById("count")
        .textContent =
            list.length + " film";
    if(list.length === 0){
        box.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🔍</div>
                <h3>Film tidak ditemukan</h3>
                <p>
                    Coba gunakan judul, genre,
                    atau tahun yang berbeda.
                </p>
            </div>
        `;
        return;
    }
    list.forEach(movie => {
        box.appendChild(createMovieCard(movie));
    });
}
/* =========================================================
   MOVIE CARD
   ========================================================= */
function createMovieCard(movie){
    const card =
        document.createElement("div");
    card.className = "movie";
    const saved =
        watchlist.includes(movie.id);
    const poster =
        getPoster(movie);
    card.innerHTML = `
        <div class="poster-wrap">
            <img
                class="poster"
                src="${poster}"
                alt="${escapeHtml(movie.title)}"
                loading="lazy">
            <div class="rating">
                ⭐ ${movie.rating}
            </div>
            <button
                class="save ${saved ? "saved" : ""}"
                onclick="toggleWatchlist(event,${movie.id})">
                ${saved ? "♥" : "♡"}
            </button>
        </div>
        <div class="movie-info">
            <div class="movie-title">
                ${escapeHtml(movie.title)}
            </div>
            <div class="movie-meta">
                ${movie.year} • ${movie.duration}
            </div>
            <div class="genre">
                ${movie.genre.slice(0,2).join(" • ")}
            </div>
        </div>
    `;
    card.onclick = () =>
        showDetails(movie.id);
    return card;
}
/* =========================================================
   POSTER
   =========================================================
   Karena web ini 100% tanpa API,
   poster dibuat otomatis dari SVG.
   Tidak membutuhkan server eksternal.
   */
function getPoster(movie){
    const first =
        movie.title.charAt(0).toUpperCase();
    const genre =
        movie.genre[0];
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="500"
             height="750">
            <defs>
                <linearGradient
                    id="g"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
                    <stop
                        offset="0%"
                        stop-color="#315efb"/>
                    <stop
                        offset="100%"
                        stop-color="#7c4dff"/>
                </linearGradient>
            </defs>
            <rect
                width="500"
                height="750"
                fill="url(#g)"/>
            <circle
                cx="410"
                cy="100"
                r="130"
                fill="#ffffff"
                opacity=".10"/>
            <circle
                cx="80"
                cy="650"
                r="180"
                fill="#ffffff"
                opacity=".08"/>
            <text
                x="250"
                y="315"
                text-anchor="middle"
                font-family="Arial"
                font-size="180"
                font-weight="900"
                fill="white"
                opacity=".95">
                ${first}
            </text>
            <text
                x="250"
                y="500"
                text-anchor="middle"
                font-family="Arial"
                font-size="28"
                font-weight="bold"
                fill="white">
                ${escapeXml(movie.title)}
            </text>
            <text
                x="250"
                y="550"
                text-anchor="middle"
                font-family="Arial"
                font-size="20"
                fill="white"
                opacity=".85">
                ${escapeXml(genre)} • ${movie.year}
            </text>
            <text
                x="250"
                y="690"
                text-anchor="middle"
                font-family="Arial"
                font-size="18"
                fill="white"
                opacity=".7">
                MOVIE FINDER
            </text>
        </svg>
    `;
    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}
/* =========================================================
   DETAILS
   ========================================================= */
function showDetails(id){
    const movie =
        movies.find(m => m.id === id);
    if(!movie) return;
    const saved =
        watchlist.includes(movie.id);
    const detail =
        document.getElementById("detail");
    detail.innerHTML = `
        <div class="detail">
            <div>
                <img
                    class="detail-poster"
                    src="${getPoster(movie)}"
                    alt="${escapeHtml(movie.title)}">
            </div>
            <div>
                <h2>
                    ${escapeHtml(movie.title)}
                </h2>
                <div class="detail-meta">
                    ${movie.year}
                    • ${movie.duration}
                    • ⭐ ${movie.rating}
                </div>
                <div class="tags">
                    ${movie.genre.map(g => `
                        <span class="tag">
                            ${escapeHtml(g)}
                        </span>
                    `).join("")}
                </div>
                <h3>Sinopsis</h3>
                <p>
                    ${escapeHtml(movie.description)}
                </p>
                <h3>Sutradara</h3>
                <p>
                    ${escapeHtml(movie.director)}
                </p>
                <h3>Pemeran</h3>
                <p>
                    ${escapeHtml(movie.cast)}
                </p>
                <button
                    class="watch-btn ${saved ? "saved" : ""}"
                    onclick="toggleWatchlist(null,${movie.id});refreshDetail(${movie.id})">
                    ${saved
                        ? "♥ Hapus dari Watchlist"
                        : "♡ Tambah ke Watchlist"}
                </button>
            </div>
        </div>
    `;
    document
        .getElementById("modal")
        .classList.add("show");
}
/* =========================================================
   REFRESH DETAIL
   ========================================================= */
function refreshDetail(id){
    showDetails(id);
}
/* =========================================================
   MODAL
   ========================================================= */
function closeModal(){
    document
        .getElementById("modal")
        .classList.remove("show");
}
function closeOutside(event){
    if(event.target.id === "modal"){
        closeModal();
    }
}
/* =========================================================
   WATCHLIST
   ========================================================= */
function toggleWatchlist(event,id){
    if(event){
        event.stopPropagation();
    }
    if(watchlist.includes(id)){
        watchlist =
            watchlist.filter(
                movieId => movieId !== id
            );
    }else{
        watchlist.push(id);
    }
    localStorage.setItem(
        "movie_watchlist",
        JSON.stringify(watchlist)
    );
    renderMovies(currentMovies);
    renderWatchlist();
}
/* =========================================================
   WATCHLIST PAGE
   ========================================================= */
function showWatchlist(){
    document
        .getElementById("mainContent")
        .classList.add("hide");
    document
        .getElementById("watchlist")
        .classList.add("show");
    document
        .getElementById("homeBtn")
        .classList.remove("active");
    document
        .getElementById("watchBtn")
        .classList.add("active");
    renderWatchlist();
}
function showHome(){
    document
        .getElementById("mainContent")
        .classList.remove("hide");
    document
        .getElementById("watchlist")
        .classList.remove("show");
    document
        .getElementById("homeBtn")
        .classList.add("active");
    document
        .getElementById("watchBtn")
        .classList.remove("active");
}
function renderWatchlist(){
    const box =
        document.getElementById("watchMovies");
    const savedMovies =
        movies.filter(movie =>
            watchlist.includes(movie.id)
        );
    document
        .getElementById("watchCount")
        .textContent =
            savedMovies.length + " film";
    box.innerHTML = "";
    if(savedMovies.length === 0){
        box.innerHTML = `
            <div class="empty">
                <div class="empty-icon">❤️</div>
                <h3>Watchlist masih kosong</h3>
                <p>
                    Tekan ♡ pada film untuk
                    menyimpannya di sini.
                </p>
            </div>
        `;
        return;
    }
    savedMovies.forEach(movie => {
        box.appendChild(
            createMovieCard(movie)
        );
    });
}
/* =========================================================
   ESCAPE
   ========================================================= */
function escapeHtml(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
function escapeXml(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&apos;");
}
/* =========================================================
   START
   ========================================================= */
init();
</script>

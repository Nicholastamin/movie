<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Movie Finder</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;font-family:Arial,Helvetica,sans-serif;
 background:#f4f7ff;color:#172033
}
button,select,input{font:inherit}
button{cursor:pointer}
header{
 position:sticky;top:0;z-index:100;
 background:rgba(255,255,255,.96);
 backdrop-filter:blur(12px);
 border-bottom:1px solid #e5e8f0
}
.nav{
 max-width:1250px;margin:auto;padding:12px 16px;
 display:flex;align-items:center;justify-content:space-between;gap:10px
}
.logo{
 display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px
}
.logoIcon{
 width:40px;height:40px;border-radius:12px;
 display:grid;place-items:center;color:#fff;
 background:linear-gradient(135deg,#655cf6,#9b7cff)
}
.navlinks{display:flex;gap:7px;flex-wrap:wrap}
.navlinks a{
 text-decoration:none;color:#596276;padding:9px 11px;
 border-radius:10px;font-size:13px;font-weight:700
}
.navlinks a:hover,.navlinks a.active{background:#eeeeff;color:#554bd9}
main{max-width:1250px;margin:auto;padding:25px 16px 70px}
.hero{text-align:center;padding:20px 0 25px}
.hero h1{font-size:clamp(30px,6vw,50px);margin:0}
.hero p{color:#737d90;line-height:1.6}
.searchArea{max-width:850px;margin:auto;position:relative}
.searchBox{
 display:flex;align-items:center;gap:8px;background:white;
 border:1px solid #dfe4ef;border-radius:17px;padding:7px;
 box-shadow:0 12px 30px #24305212
}
.searchBox input{
 flex:1;border:0;outline:0;padding:13px 4px;min-width:0
}
.searchBtn{
 border:0;background:#655cf6;color:white;padding:12px 19px;
 border-radius:12px;font-weight:700
}
.clearBtn{
 border:0;background:#eef0f6;width:38px;height:38px;border-radius:10px
}
.preview{
 display:none;position:absolute;top:65px;left:0;right:0;
 background:white;border:1px solid #e1e5ef;border-radius:16px;
 overflow:hidden;z-index:30;box-shadow:0 20px 45px #1d28451c
}
.preview.show{display:block}
.previewItem{
 display:flex;gap:10px;padding:9px;border-bottom:1px solid #edf0f5
}
.previewItem img{width:42px;height:60px;object-fit:cover;border-radius:7px}
.previewTitle{font-weight:700}
.previewMeta{font-size:12px;color:#7c8494;margin-top:5px}
.filters{
 display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:22px 0
}
select,.filterBtn{
 border:1px solid #dce2ed;background:white;border-radius:11px;
 padding:11px;color:#30394c;outline:0
}
.filterBtn{background:#eeeeff;color:#554bd9;font-weight:700}
.sectionHead{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin:25px 0 14px
}
.sectionTitle{font-size:23px;font-weight:800}
.resultInfo{font-size:13px;color:#788194}
.grid{
 display:grid;grid-template-columns:repeat(5,1fr);gap:17px
}
.card{
 background:white;border:1px solid #e3e7ef;border-radius:16px;
 overflow:hidden;box-shadow:0 7px 20px #2430520b;
 transition:.2s
}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #24305217}
.poster{
 aspect-ratio:2/3;background:#e8ebf2;position:relative;overflow:hidden
}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.rate{
 position:absolute;right:8px;top:8px;background:#fff;padding:6px 8px;
 border-radius:8px;font-size:12px;font-weight:800;color:#dc8a00
}
.cardInfo{padding:10px}
.cardTitle{font-weight:800;line-height:1.35;min-height:39px}
.cardYear{font-size:12px;color:#7b8496;margin-top:5px}
.cardActions{display:flex;gap:6px;margin-top:9px}
.smallBtn{
 flex:1;border:0;border-radius:9px;padding:8px 3px;
 background:#f0f1f8;color:#4e5870;font-size:11px;font-weight:700
}
.smallBtn.active{background:#eeeefe;color:#554bd9}
.loading{
 padding:30px;text-align:center;color:#747e90
}
.spinner{
 display:inline-block;width:20px;height:20px;border:3px solid #dddffb;
 border-top-color:#655cf6;border-radius:50%;animation:spin .8s linear infinite;
 vertical-align:middle;margin-right:8px
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{
 background:white;border:1px solid #e3e7ef;border-radius:17px;
 padding:45px 20px;text-align:center;color:#737d90
}
.emptyIcon{font-size:43px}
.modal{
 position:fixed;inset:0;background:#1821398c;z-index:300;
 display:none;align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}
.modalBox{
 width:min(900px,100%);max-height:92vh;overflow:auto;
 background:white;border-radius:23px;position:relative
}
.close{
 position:absolute;right:12px;top:12px;width:39px;height:39px;
 border:0;border-radius:11px;background:white;box-shadow:0 4px 15px #0002;
 z-index:5
}
.detail{display:grid;grid-template-columns:270px 1fr;gap:23px;padding:25px}
.detailPoster{width:100%;border-radius:16px}
.detail h2{font-size:29px;margin:0 45px 8px 0}
.meta{color:#747e90;font-size:14px}
.genres{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.genre{
 padding:6px 9px;border-radius:8px;background:#eeeeff;
 color:#554bd9;font-size:12px;font-weight:700
}
.overview{line-height:1.7;color:#515b6d}
.detailBtns{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.actionBtn{
 border:0;border-radius:11px;padding:10px 13px;
 background:#eeeeff;color:#554bd9;font-weight:700
}
.actionBtn.primary{background:#655cf6;color:white}
.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{
 background:#f6f7fb;padding:10px;border-radius:10px
}
.info small{display:block;color:#7b8495}
.cast{
 display:flex;gap:9px;overflow:auto;padding-bottom:5px
}
.person{min-width:80px;text-align:center}
.person img{
 width:65px;height:65px;border-radius:50%;object-fit:cover;background:#e9ebf2
}
.person div{font-size:11px;margin-top:5px}
.settings{padding:27px}
.settings input{
 width:100%;padding:13px;border:1px solid #dce2ec;
 border-radius:11px;margin:10px 0;outline:0
}
.save{
 width:100%;padding:13px;border:0;border-radius:11px;
 background:#655cf6;color:white;font-weight:700
}
.delete{
 width:100%;padding:12px;border:0;border-radius:11px;
 background:#fff0f0;color:#d64d4d;font-weight:700;margin-top:8px
}
.quick{
 display:flex;gap:8px;overflow:auto;padding-bottom:5px
}
.quick button{
 white-space:nowrap;border:0;background:white;border:1px solid #e1e5ed;
 border-radius:11px;padding:10px 13px;color:#596276
}
.toast{
 position:fixed;bottom:20px;left:50%;z-index:500;
 transform:translate(-50%,100px);opacity:0;
 background:#172033;color:white;padding:12px 17px;border-radius:11px;
 transition:.25s;max-width:90%;text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.comparePanel{
 position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
 z-index:200;background:white;border:1px solid #ddd;
 border-radius:15px;padding:10px;box-shadow:0 12px 35px #0002;
 display:none;max-width:95%
}
.comparePanel.show{display:flex;gap:8px;align-items:center}
.comparePanel button{
 border:0;border-radius:9px;padding:9px;background:#655cf6;color:#fff
}
@media(max-width:1050px){
 .grid{grid-template-columns:repeat(4,1fr)}
 .filters{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
 .navlinks a{font-size:11px;padding:7px}
 .logo span{display:none}
 main{padding:17px 11px 60px}
 .grid{grid-template-columns:repeat(2,1fr);gap:11px}
 .filters{grid-template-columns:1fr 1fr}
 .detail{grid-template-columns:1fr;padding:18px}
 .detailPoster{width:180px;display:block;margin:auto}
 .detail h2{font-size:24px}
 .infoGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="nav">
 <div class="logo">
  <div class="logoIcon">🎬</div>
  <span>Movie Finder</span>
 </div>

 <nav class="navlinks">
  <a class="active" href="index.html">🏠 Home</a>
  <a href="watchlist.html">❤️ Saved</a>
  <button onclick="openSettings()" style="border:0;background:transparent;font-size:18px">⚙️</button>
 </nav>
</div>
</header>

<main>

<section class="hero">
 <h1>Find Your Next Movie 🍿</h1>
 <p>Cari, filter, simpan, bandingkan, dan temukan film favoritmu.</p>
</section>

<div class="searchArea">
 <div class="searchBox">
  <span>🔎</span>
  <input id="search" placeholder="Cari judul film atau aktor..." autocomplete="off">
  <button class="clearBtn" id="clear" onclick="clearSearch()" style="display:none">✕</button>
  <button class="searchBtn" onclick="searchMovies()">Cari</button>
 </div>
 <div id="preview" class="preview"></div>
</div>

<div class="quick" style="margin-top:15px">
 <button onclick="loadCategory('trending')">🔥 Trending</button>
 <button onclick="loadCategory('now')">🎬 Now Playing</button>
 <button onclick="loadCategory('upcoming')">🆕 Upcoming</button>
 <button onclick="loadCategory('top')">⭐ Top Rated</button>
 <button onclick="randomMovie()">🎲 Surprise Me</button>
 <button onclick="openRoulette()">🎰 Roulette</button>
</div>

<div class="filters">

 <select id="genre">
  <option value="">🎭 Semua Genre</option>
 </select>

 <select id="year">
  <option value="">📅 Semua Tahun</option>
 </select>

 <select id="rating">
  <option value="">⭐ Semua Rating</option>
  <option value="9">9+</option>
  <option value="8">8+</option>
  <option value="7">7+</option>
  <option value="6">6+</option>
  <option value="5">5+</option>
 </select>

 <select id="language">
  <option value="">🗣️ Semua Bahasa</option>
  <option value="en">English</option>
  <option value="id">Indonesia</option>
  <option value="ko">Korea</option>
  <option value="ja">Jepang</option>
  <option value="zh">Mandarin</option>
  <option value="fr">Prancis</option>
  <option value="es">Spanyol</option>
  <option value="de">Jerman</option>
 </select>

 <select id="sort">
  <option value="popularity.desc">🔥 Terpopuler</option>
  <option value="vote_average.desc">⭐ Rating Tertinggi</option>
  <option value="primary_release_date.desc">🆕 Terbaru</option>
  <option value="revenue.desc">💰 Revenue</option>
  <option value="vote_count.desc">👥 Vote Terbanyak</option>
 </select>

 <button class="filterBtn" onclick="resetFilters()">Reset Filter</button>

</div>

<div class="sectionHead">
 <div id="title" class="sectionTitle">🔥 Film Populer</div>
 <div id="resultInfo" class="resultInfo"></div>
</div>

<div id="grid" class="grid"></div>
<div id="loading" class="loading" style="display:none">
 <span class="spinner"></span> Memuat film...
</div>
<div id="trigger" style="height:20px"></div>

</main>

<div id="comparePanel" class="comparePanel">
 <span id="compareCount">0/3</span>
 <button onclick="compareMovies()">⚖️ Compare</button>
 <button onclick="clearCompare()">✕</button>
</div>

<!-- DETAIL -->
<div id="detailModal" class="modal" onclick="outsideClose(event,'detailModal')">
<div class="modalBox">
<button class="close" onclick="closeModal('detailModal')">✕</button>
<div id="detailContent"></div>
</div>
</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal">
<div class="modalBox settings">
<button class="close" onclick="closeModal('settingsModal')">✕</button>
<h2>⚙️ Pengaturan TMDB</h2>
<p style="color:#727c8e;line-height:1.6">
Masukkan API Key atau Read Access Token TMDB sekali.
Data akan disimpan pada browser perangkat ini.
</p>
<input id="apiInput" type="password" placeholder="TMDB API Key / Read Access Token">
<button class="save" onclick="saveAPI()">Simpan API</button>
<button class="delete" onclick="deleteAPI()">Hapus API</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_KEY_STORAGE="movie_finder_tmdb_key";
const IMAGE="https://image.tmdb.org/t/p/w500";
const PROFILE="https://image.tmdb.org/t/p/w185";

let apiKey=localStorage.getItem(API_KEY_STORAGE)||"";
let page=0,totalPages=1,loading=false;
let mode="discover",query="";
let compareList=[];
let previewTimer;

const $=id=>document.getElementById(id);

function esc(x){
 return String(x||"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[m]));
}

function poster(path,title="No Poster"){
 if(path)return IMAGE+path;
 return "data:image/svg+xml;charset=UTF-8,"+
 encodeURIComponent(`
 <svg xmlns="http://www.w3.org/2000/svg" width="500" height="750">
 <rect width="100%" height="100%" fill="#e9ecf3"/>
 <text x="50%" y="46%" text-anchor="middle" font-size="55">🎬</text>
 <text x="50%" y="55%" text-anchor="middle"
 font-family="Arial" font-size="20" fill="#777">
 ${esc(title).slice(0,25)}</text></svg>`);
}

function request(endpoint,params={}){
 let u=new URL("https://api.themoviedb.org/3"+endpoint);
 Object.entries(params).forEach(([k,v])=>{
  if(v!==""&&v!==null&&v!==undefined)u.searchParams.set(k,v);
 });
 let opt={headers:{accept:"application/json"}};
 if(apiKey.startsWith("eyJ")){
  opt.headers.Authorization="Bearer "+apiKey;
 }else u.searchParams.set("api_key",apiKey);
 return {url:u.toString(),opt};
}

async function api(endpoint,params={}){
 if(!apiKey)throw new Error("API belum diatur.");
 let r=request(endpoint,params);
 let res=await fetch(r.url,r.opt);
 let data=await res.json();
 if(!res.ok)throw new Error(data.status_message||"TMDB Error");
 return data;
}

function showToast(t){
 $("toast").textContent=t;
 $("toast").classList.add("show");
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>$("toast").classList.remove("show"),2800);
}

function getData(name){
 try{return JSON.parse(localStorage.getItem(name)||"[]")}catch{return[]}
}
function setData(name,data){
 localStorage.setItem(name,JSON.stringify(data));
}

function isSaved(type,id){
 return getData(type).some(x=>x.id===id);
}

function saveMovie(type,movie){
 let data=getData(type);
 if(!data.some(x=>x.id===movie.id)){
  data.unshift(movie);setData(type,data);
  showToast(type==="favorites"?"❤️ Ditambahkan ke Favorite":"📌 Ditambahkan ke Watchlist");
 }else{
  data=data.filter(x=>x.id!==movie.id);setData(type,data);
  showToast("Dihapus");
 }
 renderCardStates();
}

function renderCardStates(){
 document.querySelectorAll("[data-id]").forEach(card=>{
  let id=Number(card.dataset.id);
  let f=card.querySelector(".favBtn");
  let w=card.querySelector(".watchBtn");
  if(f)f.classList.toggle("active",isSaved("favorites",id));
  if(w)w.classList.toggle("active",isSaved("watchlist",id));
 });
}

function addHistory(movie){
 let data=getData("history").filter(x=>x.id!==movie.id);
 data.unshift({...movie,openedAt:Date.now()});
 setData("history",data.slice(0,100));
}

function createCard(m){
 const el=document.createElement("div");
 el.className="card";el.dataset.id=m.id;
 el.innerHTML=`
 <div class="poster" onclick="openMovie(${m.id})">
  <img src="${poster(m.poster_path,m.title)}" loading="lazy" alt="${esc(m.title)}">
  <span class="rate">⭐ ${(m.vote_average||0).toFixed(1)}</span>
 </div>
 <div class="cardInfo">
  <div class="cardTitle">${esc(m.title)}</div>
  <div class="cardYear">${m.release_date?m.release_date.slice(0,4):"—"}</div>
  <div class="cardActions">
   <button class="smallBtn favBtn ${isSaved("favorites",m.id)?"active":""}"
    onclick="event.stopPropagation();saveMovie('favorites',movieObject(${JSON.stringify(m)}))">❤️</button>
   <button class="smallBtn watchBtn ${isSaved("watchlist",m.id)?"active":""}"
    onclick="event.stopPropagation();saveMovie('watchlist',movieObject(${JSON.stringify(m)}))">📌</button>
   <button class="smallBtn" onclick="event.stopPropagation();toggleCompare(${m.id},movieObject(${JSON.stringify(m)}))">⚖️</button>
  </div>
 </div>`;
 return el;
}

function movieObject(x){return x}

function appendMovies(list){
 list.forEach(m=>$("grid").appendChild(createCard(m)));
 renderCardStates();
}

function discoverParams(){
 let p={
  language:"id-ID",
  include_adult:false,
  include_video:false,
  sort_by:$("sort").value,
  page:page+1
 };
 if($("genre").value)p.with_genres=$("genre").value;
 if($("year").value)p.primary_release_year=$("year").value;
 if($("rating").value)p.vote_average_gte=$("rating").value;
 if($("language").value)p.with_original_language=$("language").value;
 if($("rating").value||$("sort").value==="vote_average.desc")
  p.vote_count_gte=50;
 return p;
}

async function loadNext(){
 if(loading||page>=totalPages)return;
 loading=true;$("loading").style.display="block";
 try{
  let d;
  if(mode==="search"){
   d=await api("/search/movie",{
    query:query,language:"id-ID",include_adult:false,page:page+1
   });
  }else if(mode==="category"){
   d=await api("/movie/"+window.category,{
    language:"id-ID",page:page+1
   });
  }else{
   d=await api("/discover/movie",discoverParams());
  }
  page=d.page;totalPages=Math.min(d.total_pages||1,500);
  appendMovies(d.results||[]);
  $("resultInfo").textContent=(d.total_results||0).toLocaleString("id-ID")+" hasil";
 }catch(e){showToast(e.message)}
 loading=false;$("loading").style.display="none";
}

async function newDiscover(){
 if(!apiKey){openSettings();return}
 mode="discover";query="";page=0;totalPages=1;
 $("grid").innerHTML="";
 $("title").textContent=filterTitle();
 await loadNext();
}

function filterTitle(){
 let a=[];
 if($("genre").value)a.push($("genre").selectedOptions[0].text);
 if($("year").value)a.push($("year").value);
 if($("rating").value)a.push("⭐ "+$("rating").value+"+");
 if($("language").value)a.push($("language").selectedOptions[0].text);
 return a.length?a.join(" • "):"🔥 Film Populer";
}

async function searchMovies(){
 let q=$("search").value.trim();
 $("preview").classList.remove("show");
 if(!q){return newDiscover()}
 if(!apiKey){openSettings();return}
 query=q;mode="search";page=0;totalPages=1;
 $("grid").innerHTML="";
 $("title").textContent='🔎 "'+q+'"';
 await loadNext();
}

function clearSearch(){
 $("search").value="";$("clear").style.display="none";
 $("preview").classList.remove("show");newDiscover();
}

async function loadCategory(type){
 if(!apiKey){openSettings();return}
 mode="category";page=0;totalPages=1;
 window.category=
 type==="trending"?"popular":
 type==="now"?"now_playing":
 type==="upcoming"?"upcoming":"top_rated";
 $("grid").innerHTML="";
 $("title").textContent={
 trending:"🔥 Trending / Popular",
 now:"🎬 Now Playing",
 upcoming:"🆕 Upcoming",
 top:"⭐ Top Rated"
 }[type];
 await loadNext();
}

async function randomMovie(){
 if(!apiKey){openSettings();return}
 try{
  let d=await api("/discover/movie",{
   language:"id-ID",sort_by:"popularity.desc",
   page:Math.floor(Math.random()*10)+1
  });
  if(d.results.length){
   openMovie(d.results[Math.floor(Math.random()*d.results.length)].id);
  }
 }catch(e){showToast(e.message)}
}

async function openRoulette(){
 if(!apiKey){openSettings();return}
 let genre=$("genre").value;
 try{
  let d=await api("/discover/movie",{
   language:"id-ID",
   sort_by:"popularity.desc",
   with_genres:genre||undefined,
   vote_average_gte:$("rating").value||undefined,
   page:Math.floor(Math.random()*10)+1
  });
  if(!d.results.length){showToast("Tidak ada film");return}
  let m=d.results[Math.floor(Math.random()*d.results.length)];
  openMovie(m.id);
 }catch(e){showToast(e.message)}
}

async function openMovie(id){
 if(!apiKey){openSettings();return}
 $("detailModal").classList.add("show");
 $("detailContent").innerHTML='<div class="loading"><span class="spinner"></span> Memuat detail...</div>';
 try{
  let m=await api("/movie/"+id,{
   language:"id-ID",append_to_response:"credits,videos,similar,recommendations"
  });
  addHistory(m);
  let director=(m.credits?.crew||[]).find(x=>x.job==="Director");
  let cast=(m.credits?.cast||[]).slice(0,8);
  let trailer=(m.videos?.results||[]).find(x=>x.site==="YouTube"&&(x.type==="Trailer"||x.type==="Teaser"));
  let similar=(m.similar?.results||[]).slice(0,5);

  $("detailContent").innerHTML=`
  <div class="detail">
   <div><img class="detailPoster" src="${poster(m.poster_path,m.title)}"></div>
   <div>
    <h2>${esc(m.title)}</h2>
    <div class="meta">
     ${m.release_date||"—"} • ⭐ ${(m.vote_average||0).toFixed(1)}
     • ${m.runtime?m.runtime+" menit":"—"}
    </div>

    <div class="genres">
     ${(m.genres||[]).map(g=>`<span class="genre">${esc(g.name)}</span>`).join("")}
    </div>

    <div class="detailBtns">
     ${trailer?`<button class="actionBtn primary" onclick="location.href='trailer.html?id=${m.id}'">▶️ Trailer</button>`:""}
     <button class="actionBtn" onclick='saveMovie("favorites",movieObject(${JSON.stringify(m)}))'>❤️ Favorite</button>
     <button class="actionBtn" onclick='saveMovie("watchlist",movieObject(${JSON.stringify(m)}))'>📌 Watchlist</button>
     <button class="actionBtn" onclick='toggleCompare(${m.id},movieObject(${JSON.stringify(m)}))'>⚖️ Compare</button>
     <button class="actionBtn" onclick="shareMovie(${m.id})">↗️ Share</button>
    </div>

    <p class="overview">${esc(m.overview||"Sinopsis tidak tersedia.")}</p>

    <div class="infoGrid">
     <div class="info"><small>Director</small><b>${esc(director?.name||"—")}</b></div>
     <div class="info"><small>Bahasa asli</small><b>${esc(m.original_language||"—").toUpperCase()}</b></div>
     <div class="info"><small>Votes</small><b>${(m.vote_count||0).toLocaleString("id-ID")}</b></div>
     <div class="info"><small>Budget</small><b>${money(m.budget)}</b></div>
     <div class="info"><small>Revenue</small><b>${money(m.revenue)}</b></div>
     <div class="info"><small>Negara</small><b>${esc((m.production_countries||[]).map(x=>x.name).join(", ")||"—")}</b></div>
    </div>

    <h3>👥 Cast</h3>
    <div class="cast">
     ${cast.map(p=>`
      <div class="person">
       <img src="${p.profile_path?PROFILE+p.profile_path:poster("",p.name)}">
       <div>${esc(p.name)}</div>
      </div>`).join("")}
    </div>

    <h3>🎬 Film Serupa</h3>
    <div class="grid" style="grid-template-columns:repeat(5,1fr)">
     ${similar.map(x=>`
      <div class="card" onclick="openMovie(${x.id})">
       <div class="poster"><img src="${poster(x.poster_path,x.title)}"></div>
       <div class="cardInfo"><div class="cardTitle">${esc(x.title)}</div></div>
      </div>`).join("")}
    </div>
   </div>
  </div>`;
 }catch(e){
  $("detailContent").innerHTML=`<div class="empty">⚠️ ${esc(e.message)}</div>`;
 }
}

function money(n){
 if(!n)return "—";
 return "$"+Number(n).toLocaleString("en-US");
}

async function shareMovie(id){
 let url=location.origin+location.pathname+"?movie="+id;
 try{
  await navigator.clipboard.writeText(url);
  showToast("Link film disalin.");
 }catch{
  showToast(url);
 }
}

function closeModal(id){$(id).classList.remove("show")}
function outsideClose(e,id){if(e.target.id===id)closeModal(id)}

function toggleCompare(id,m){
 let i=compareList.findIndex(x=>x.id===id);
 if(i>=0)compareList.splice(i,1);
 else{
  if(compareList.length>=3){showToast("Maksimal 3 film.");return}
  compareList.push(m);
 }
 $("comparePanel").classList.toggle("show",compareList.length>0);
 $("compareCount").textContent=compareList.length+"/3";
 renderCardStates();
}

function clearCompare(){
 compareList=[];$("comparePanel").classList.remove("show");
 renderCardStates();
}

function compareMovies(){
 if(compareList.length<2){showToast("Pilih minimal 2 film.");return}
 let rows=[
 ["Rating","vote_average",x=>(x||0).toFixed(1)],
 ["Tahun","release_date",x=>x?.slice(0,4)||"—"],
 ["Durasi","runtime",x=>x?x+" menit":"—"],
 ["Votes","vote_count",x=>(x||0).toLocaleString("id-ID")],
 ["Budget","budget",money],
 ["Revenue","revenue",money]
 ];
 let html=`<div class="settings"><h2>⚖️ Compare Movies</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>Data</th>${compareList.map(x=>`<th>${esc(x.title)}</th>`).join("")}</tr>`;
 rows.forEach(r=>{
  html+=`<tr><td style="padding:10px;font-weight:bold">${r[0]}</td>`;
  compareList.forEach(x=>html+=`<td style="padding:10px;text-align:center">${r[2](x[r[1]])}</td>`);
  html+="</tr>";
 });
 html+="</table></div></div>";
 $("detailContent").innerHTML=html;
 $("detailModal").classList.add("show");
}

function resetFilters(){
 $("genre").value="";$("year").value="";$("rating").value="";
 $("language").value="";$("sort").value="popularity.desc";
 $("search").value="";$("clear").style.display="none";
 newDiscover();
}

["genre","year","rating","language","sort"].forEach(id=>{
 $(id).addEventListener("change",newDiscover);
});

$("search").addEventListener("input",()=>{
 let q=$("search").value.trim();
 $("clear").style.display=q?"block":"none";
 clearTimeout(previewTimer);
 if(!q){$("preview").classList.remove("show");return}
 previewTimer=setTimeout(()=>loadPreview(q),350);
});

$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchMovies();
 if(e.key==="Escape")$("preview").classList.remove("show");
});

async function loadPreview(q){
 if(!apiKey)return;
 try{
  let d=await api("/search/movie",{
   query:q,language:"id-ID",page:1,include_adult:false
  });
  $("preview").innerHTML=(d.results||[]).slice(0,6).map(m=>`
   <div class="previewItem" onclick="openMovie(${m.id})">
    <img src="${poster(m.poster_path,m.title)}">
    <div>
     <div class="previewTitle">${esc(m.title)}</div>
     <div class="previewMeta">${m.release_date?.slice(0,4)||"—"} • ⭐ ${(m.vote_average||0).toFixed(1)}</div>
    </div>
   </div>`).join("")||"<div style='padding:15px'>Tidak ditemukan.</div>";
  $("preview").classList.add("show");
 }catch{}
}

function openSettings(){
 $("apiInput").value=apiKey;
 $("settingsModal").classList.add("show");
}

async function saveAPI(){
 let v=$("apiInput").value.trim();
 if(!v){showToast("Masukkan API.");return}
 apiKey=v;localStorage.setItem(API_KEY_STORAGE,v);
 closeModal("settingsModal");
 await initialize();
 showToast("API berhasil disimpan.");
}

function deleteAPI(){
 localStorage.removeItem(API_KEY_STORAGE);apiKey="";
 closeModal("settingsModal");
 $("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">
 <div class="emptyIcon">🔑</div><h3>API belum diatur</h3>
 <p>Klik ⚙️ untuk memasukkan API TMDB.</p></div>`;
}

async function initialize(){
 loadYears();
 if(!apiKey){
  $("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">
  <div class="emptyIcon">🎬</div><h3>Selamat datang!</h3>
  <p>Masukkan TMDB API melalui ⚙️ untuk mulai.</p></div>`;
  return;
 }
 try{
  let d=await api("/genre/movie/list",{language:"id-ID"});
  $("genre").innerHTML='<option value="">🎭 Semua Genre</option>'+
   d.genres.map(g=>`<option value="${g.id}">🎭 ${esc(g.name)}</option>`).join("");
 }catch{}
 newDiscover();
}

function loadYears(){
 if($("year").options.length>1)return;
 let y=new Date().getFullYear();
 for(let i=y;i>=1900;i--){
  let o=document.createElement("option");
  o.value=i;o.textContent="📅 "+i;$("year").appendChild(o);
 }
}

const observer=new IntersectionObserver(e=>{
 if(e[0].isIntersecting){
  if(mode==="search"||mode==="discover"||mode==="category")loadNext();
 }
},{rootMargin:"700px"});
observer.observe($("trigger"));

document.addEventListener("click",e=>{
 if(!e.target.closest(".searchArea"))$("preview").classList.remove("show");
});

initialize();
</script>
</body>
</html>

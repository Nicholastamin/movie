<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Movie Finder</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7ff;
    color:#172033;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #e6eaf3;
}

.header-inner{
    max-width:1250px;
    margin:auto;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:800;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#6c63ff,#8d7cff);
    color:white;
    font-size:21px;
    box-shadow:0 7px 18px rgba(108,99,255,.25);
}

.settings-btn{
    border:0;
    background:#eef0ff;
    color:#5148d9;
    width:42px;
    height:42px;
    border-radius:13px;
    cursor:pointer;
    font-size:19px;
}

.settings-btn:hover{
    background:#e2e4ff;
}

/* ================= MAIN ================= */

main{
    max-width:1250px;
    margin:auto;
    padding:28px 18px 60px;
}

.hero{
    text-align:center;
    padding:20px 0 25px;
}

.hero h1{
    margin:0;
    font-size:clamp(30px,6vw,50px);
    line-height:1.1;
}

.hero p{
    margin:12px auto 0;
    color:#697386;
    max-width:650px;
    line-height:1.6;
}

/* ================= SEARCH ================= */

.search-area{
    max-width:850px;
    margin:15px auto 25px;
    position:relative;
}

.search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    border:1px solid #dfe4f0;
    border-radius:18px;
    padding:7px;
    box-shadow:0 12px 30px rgba(36,46,80,.08);
}

.search-icon{
    margin-left:12px;
    color:#7b8497;
    font-size:19px;
}

#searchInput{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    padding:13px 5px;
    font-size:16px;
    min-width:0;
}

.search-btn{
    border:0;
    border-radius:13px;
    padding:12px 20px;
    background:#655cf6;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.search-btn:hover{
    background:#5148dc;
}

.clear-btn{
    border:0;
    background:#f0f2f7;
    width:38px;
    height:38px;
    border-radius:11px;
    cursor:pointer;
    color:#687186;
}

/* ================= LIVE PREVIEW ================= */

.preview{
    position:absolute;
    top:67px;
    left:0;
    right:0;
    background:white;
    border:1px solid #e0e5ef;
    border-radius:17px;
    box-shadow:0 20px 45px rgba(31,42,70,.16);
    overflow:hidden;
    z-index:50;
    display:none;
}

.preview.show{
    display:block;
}

.preview-item{
    display:flex;
    gap:12px;
    padding:10px;
    cursor:pointer;
    border-bottom:1px solid #edf0f5;
}

.preview-item:last-child{
    border-bottom:0;
}

.preview-item:hover{
    background:#f7f8ff;
}

.preview-item img{
    width:45px;
    height:65px;
    object-fit:cover;
    border-radius:8px;
}

.preview-info{
    min-width:0;
}

.preview-title{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.preview-meta{
    color:#7c8495;
    font-size:13px;
    margin-top:5px;
}

/* ================= FILTERS ================= */

.filters{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:25px;
}

.filter{
    background:white;
    border:1px solid #dfe4ee;
    border-radius:13px;
    padding:11px 12px;
    outline:none;
    color:#293247;
    font-size:14px;
    cursor:pointer;
}

.filter:focus{
    border-color:#766cff;
    box-shadow:0 0 0 3px rgba(118,108,255,.1);
}

.reset-filter{
    border:0;
    border-radius:13px;
    background:#eeeefe;
    color:#554bd9;
    font-weight:700;
    cursor:pointer;
}

/* ================= SECTION ================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:20px 0 15px;
}

.section-title{
    font-size:23px;
    font-weight:800;
}

.result-info{
    color:#7a8395;
    font-size:14px;
}

/* ================= MOVIE GRID ================= */

.movie-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.movie-card{
    background:white;
    border-radius:17px;
    overflow:hidden;
    border:1px solid #e4e7ef;
    cursor:pointer;
    transition:.22s ease;
    box-shadow:0 8px 22px rgba(35,45,70,.06);
}

.movie-card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(35,45,70,.13);
}

.poster-wrap{
    aspect-ratio:2/3;
    background:#e9ecf4;
    overflow:hidden;
    position:relative;
}

.poster{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.rating{
    position:absolute;
    top:9px;
    right:9px;
    background:rgba(255,255,255,.94);
    color:#e68a00;
    padding:6px 8px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
}

.movie-info{
    padding:12px;
}

.movie-title{
    font-weight:800;
    line-height:1.35;
    min-height:42px;
}

.movie-year{
    color:#7b8496;
    font-size:13px;
    margin-top:7px;
}

/* ================= LOADING ================= */

.loading{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding:28px;
    color:#6d7689;
}

.spinner{
    width:21px;
    height:21px;
    border:3px solid #dfe2ff;
    border-top-color:#655cf6;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#loadMoreTrigger{
    height:20px;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:60px 20px;
    background:white;
    border-radius:18px;
    border:1px solid #e5e8ef;
    color:#70798c;
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(20,27,45,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:300;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    position:relative;
}

.close{
    position:absolute;
    top:13px;
    right:13px;
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:white;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    cursor:pointer;
    z-index:5;
    font-size:18px;
}

.detail{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:25px;
    padding:25px;
}

.detail-poster{
    width:100%;
    border-radius:17px;
}

.detail-content h2{
    font-size:30px;
    margin:0 45px 8px 0;
}

.detail-meta{
    color:#727b8d;
    margin-bottom:15px;
}

.genres{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:12px 0;
}

.genre{
    background:#eeeefe;
    color:#554bd9;
    padding:6px 9px;
    border-radius:9px;
    font-size:12px;
    font-weight:700;
}

.overview{
    line-height:1.7;
    color:#50596b;
}

.info-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:18px;
}

.info-box{
    background:#f6f7fb;
    border-radius:12px;
    padding:11px;
}

.info-label{
    color:#7c8494;
    font-size:12px;
}

.info-value{
    font-weight:700;
    margin-top:4px;
}

/* ================= SETTINGS ================= */

.settings-box{
    max-width:520px;
    padding:28px;
}

.settings-box h2{
    margin-top:0;
}

.settings-box p{
    color:#6e7789;
    line-height:1.6;
}

#apiInput{
    width:100%;
    padding:13px;
    border:1px solid #dce1ec;
    border-radius:12px;
    outline:none;
    margin:10px 0;
}

.save-api{
    width:100%;
    border:0;
    background:#655cf6;
    color:white;
    padding:13px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.delete-api{
    width:100%;
    border:0;
    background:#fff0f0;
    color:#d44b4b;
    padding:12px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    margin-top:9px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#172033;
    color:white;
    padding:12px 17px;
    border-radius:12px;
    opacity:0;
    transition:.25s;
    z-index:500;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){
    .movie-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .filters{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){
    main{
        padding:20px 12px 45px;
    }

    .header-inner{
        padding:12px;
    }

    .movie-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .search-box{
        padding:6px;
    }

    .search-btn{
        padding:11px 13px;
    }

    .detail{
        grid-template-columns:1fr;
        padding:18px;
    }

    .detail-poster{
        width:180px;
        display:block;
        margin:auto;
    }

    .detail-content h2{
        font-size:25px;
    }
}

@media(max-width:420px){
    .filters{
        grid-template-columns:1fr 1fr;
    }

    .movie-title{
        font-size:14px;
    }

    .movie-info{
        padding:9px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">
            <div class="logo-icon">🎬</div>
            <span>Movie Finder</span>
        </div>

        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>
</header>

<main>

    <section class="hero">
        <h1>Find Your Next Movie 🍿</h1>
        <p>
            Cari film berdasarkan judul, genre, tahun, rating,
            popularitas, dan lainnya.
        </p>
    </section>

    <div class="search-area">

        <div class="search-box">

            <span class="search-icon">🔎</span>

            <input
                id="searchInput"
                type="text"
                autocomplete="off"
                placeholder="Cari judul film..."
            >

            <button
                class="clear-btn"
                id="clearBtn"
                onclick="clearSearch()"
                style="display:none"
            >
                ✕
            </button>

            <button
                class="search-btn"
                onclick="performSearch()"
            >
                Cari
            </button>

        </div>

        <div id="preview" class="preview"></div>

    </div>

    <!-- FILTER -->

    <div class="filters">

        <select id="genreFilter" class="filter">
            <option value="">🎭 Semua Genre</option>
        </select>

        <select id="yearFilter" class="filter">
            <option value="">📅 Semua Tahun</option>
        </select>

        <select id="ratingFilter" class="filter">
            <option value="">⭐ Semua Rating</option>
            <option value="9">9+</option>
            <option value="8">8+</option>
            <option value="7">7+</option>
            <option value="6">6+</option>
            <option value="5">5+</option>
        </select>

        <select id="sortFilter" class="filter">

            <option value="popularity.desc">
                🔥 Terpopuler
            </option>

            <option value="vote_average.desc">
                ⭐ Rating Tertinggi
            </option>

            <option value="primary_release_date.desc">
                🆕 Terbaru
            </option>

            <option value="revenue.desc">
                💰 Pendapatan
            </option>

            <option value="vote_count.desc">
                👥 Paling Banyak Dinilai
            </option>

        </select>

        <button
            class="reset-filter"
            onclick="resetFilters()"
        >
            Reset Filter
        </button>

    </div>

    <div class="section-head">

        <div id="sectionTitle" class="section-title">
            Film Populer
        </div>

        <div id="resultInfo" class="result-info"></div>

    </div>

    <div id="movieGrid" class="movie-grid"></div>

    <div id="loading" class="loading" style="display:none">
        <div class="spinner"></div>
        <span>Memuat film...</span>
    </div>

    <div id="loadMoreTrigger"></div>

</main>


<!-- MOVIE DETAIL -->

<div id="movieModal" class="modal" onclick="closeModalOutside(event)">

    <div class="modal-box">

        <button class="close" onclick="closeMovieModal()">✕</button>

        <div id="movieDetail"></div>

    </div>

</div>


<!-- SETTINGS -->

<div id="settingsModal" class="modal">

    <div class="modal-box settings-box">

        <button class="close" onclick="closeSettings()">✕</button>

        <h2>⚙️ TMDB API</h2>

        <p>
            API disimpan di browser perangkat ini sehingga kamu
            tidak perlu memasukkannya setiap kali membuka website.
        </p>

        <input
            id="apiInput"
            type="password"
            placeholder="Masukkan TMDB API Key / Read Access Token"
        >

        <button
            class="save-api"
            onclick="saveAPI()"
        >
            Simpan API
        </button>

        <button
            class="delete-api"
            onclick="deleteAPI()"
        >
            Hapus API dari perangkat
        </button>

    </div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_STORAGE = "movie_finder_tmdb_key";

const IMAGE_BASE = "https://image.tmdb.org/t/p/w500";

let apiKey = localStorage.getItem(API_STORAGE) || "";


/* =========================================================
   STATE
========================================================= */

let currentPage = 0;
let totalPages = 1;

let isLoading = false;

let currentMode = "discover";

let currentQuery = "";

let currentResults = [];

let genreMap = {};


/* =========================================================
   DOM
========================================================= */

const movieGrid =
    document.getElementById("movieGrid");

const loading =
    document.getElementById("loading");

const loadMoreTrigger =
    document.getElementById("loadMoreTrigger");

const searchInput =
    document.getElementById("searchInput");

const preview =
    document.getElementById("preview");

const clearBtn =
    document.getElementById("clearBtn");

const genreFilter =
    document.getElementById("genreFilter");

const yearFilter =
    document.getElementById("yearFilter");

const ratingFilter =
    document.getElementById("ratingFilter");

const sortFilter =
    document.getElementById("sortFilter");

const sectionTitle =
    document.getElementById("sectionTitle");

const resultInfo =
    document.getElementById("resultInfo");


/* =========================================================
   API
========================================================= */

function apiURL(endpoint, params = {}){

    const url =
        new URL("https://api.themoviedb.org/3" + endpoint);

    Object.entries(params).forEach(([key,value])=>{

        if(
            value !== undefined &&
            value !== null &&
            value !== ""
        ){
            url.searchParams.set(key,value);
        }

    });

    if(apiKey.startsWith("eyJ")){

        return {
            url:url.toString(),
            options:{
                headers:{
                    Authorization:"Bearer " + apiKey,
                    accept:"application/json"
                }
            }
        };

    }else{

        url.searchParams.set(
            "api_key",
            apiKey
        );

        return {
            url:url.toString(),
            options:{
                headers:{
                    accept:"application/json"
                }
            }
        };

    }

}


async function tmdb(endpoint,params={}){

    const request =
        apiURL(endpoint,params);

    const response =
        await fetch(
            request.url,
            request.options
        );

    if(!response.ok){

        let message =
            "TMDB API error";

        try{

            const data =
                await response.json();

            if(data.status_message){
                message =
                    data.status_message;
            }

        }catch(e){}

        throw new Error(message);

    }

    return await response.json();

}


/* =========================================================
   PLACEHOLDER
========================================================= */

function placeholderPoster(title="No Poster"){

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="500"
         height="750"
         viewBox="0 0 500 750">

        <rect width="500" height="750"
              fill="#e9ecf4"/>

        <text
            x="250"
            y="350"
            text-anchor="middle"
            font-family="Arial"
            font-size="28"
            font-weight="bold"
            fill="#747d91">
            🎬
        </text>

        <text
            x="250"
            y="400"
            text-anchor="middle"
            font-family="Arial"
            font-size="20"
            fill="#747d91">
            ${escapeHTML(title).substring(0,25)}
        </text>

    </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   LOAD GENRES
========================================================= */

async function loadGenres(){

    if(!apiKey) return;

    try{

        const data =
            await tmdb(
                "/genre/movie/list",
                {
                    language:"id-ID"
                }
            );

        genreMap = {};

        data.genres.forEach(genre=>{

            genreMap[genre.id] =
                genre.name;

            const option =
                document.createElement("option");

            option.value =
                genre.id;

            option.textContent =
                "🎭 " + genre.name;

            genreFilter.appendChild(option);

        });

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   LOAD YEARS
========================================================= */

function loadYears(){

    const currentYear =
        new Date().getFullYear();

    for(
        let year=currentYear;
        year>=1900;
        year--
    ){

        const option =
            document.createElement("option");

        option.value = year;

        option.textContent =
            "📅 " + year;

        yearFilter.appendChild(option);

    }

}


/* =========================================================
   DISCOVER FILTER
========================================================= */

/*
   INI BAGIAN UTAMA PERBAIKANNYA.

   Filter tidak lagi memfilter currentResults.

   Sebaliknya:
   browser mengirim genre/tahun/rating/sort
   langsung ke TMDB /discover/movie.

   Jadi halaman 1, 2, 3, dst semuanya
   berasal dari hasil filter TMDB.
*/

function getDiscoverParams(){

    const params = {

        language:"id-ID",

        include_adult:false,

        include_video:false,

        sort_by:
            sortFilter.value || "popularity.desc",

        page:
            currentPage

    };


    /* GENRE */

    if(genreFilter.value){

        params.with_genres =
            genreFilter.value;

    }


    /* TAHUN */

    if(yearFilter.value){

        params.primary_release_year =
            yearFilter.value;

    }


    /* MINIMUM RATING */

    if(ratingFilter.value){

        params.vote_average_gte =
            ratingFilter.value;

    }


    /*
       Agar hasil rating tidak dipenuhi film
       dengan hanya sedikit vote.
    */

    if(
        ratingFilter.value ||
        sortFilter.value === "vote_average.desc"
    ){

        params.vote_count_gte = 50;

    }


    return params;

}


/* =========================================================
   RESET / START NEW RESULT
========================================================= */

async function startDiscover(){

    if(!apiKey){

        openSettings();

        return;

    }

    currentMode =
        "discover";

    currentQuery =
        "";

    currentPage =
        0;

    totalPages =
        1;

    currentResults =
        [];

    movieGrid.innerHTML = "";

    sectionTitle.textContent =
        "Film Populer";

    resultInfo.textContent = "";

    await loadNextPage();

}


/* =========================================================
   LOAD DISCOVER PAGE
========================================================= */

async function loadNextPage(){

    if(isLoading) return;

    if(currentPage >= totalPages) return;

    isLoading = true;

    loading.style.display =
        "flex";

    try{

        const nextPage =
            currentPage + 1;

        const params =
            getDiscoverParams();

        params.page =
            nextPage;

        const data =
            await tmdb(
                "/discover/movie",
                params
            );

        currentPage =
            data.page;

        totalPages =
            Math.min(
                data.total_pages || 1,
                500
            );

        appendMovies(
            data.results || []
        );

        updateResultInfo(
            data.total_results || 0
        );

    }catch(error){

        showToast(
            "Gagal memuat film: " +
            error.message
        );

    }finally{

        isLoading = false;

        loading.style.display =
            "none";

    }

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

    if(!apiKey){

        openSettings();

        return;

    }

    const query =
        searchInput.value.trim();

    preview.classList.remove("show");

    if(!query){

        await startDiscover();

        return;

    }

    currentMode =
        "search";

    currentQuery =
        query;

    currentPage =
        0;

    totalPages =
        1;

    currentResults =
        [];

    movieGrid.innerHTML = "";

    sectionTitle.textContent =
        'Hasil pencarian: "' +
        query +
        '"';

    resultInfo.textContent = "";

    await loadNextSearchPage();

}


/* =========================================================
   LOAD SEARCH PAGE
========================================================= */

async function loadNextSearchPage(){

    if(isLoading) return;

    if(currentPage >= totalPages) return;

    isLoading = true;

    loading.style.display =
        "flex";

    try{

        const nextPage =
            currentPage + 1;

        const data =
            await tmdb(
                "/search/movie",
                {
                    query:currentQuery,
                    language:"id-ID",
                    include_adult:false,
                    page:nextPage
                }
            );

        currentPage =
            data.page;

        totalPages =
            Math.min(
                data.total_pages || 1,
                500
            );

        appendMovies(
            data.results || []
        );

        updateResultInfo(
            data.total_results || 0
        );

    }catch(error){

        showToast(
            "Gagal mencari: " +
            error.message
        );

    }finally{

        isLoading = false;

        loading.style.display =
            "none";

    }

}


/* =========================================================
   APPEND MOVIES
========================================================= */

function appendMovies(movies){

    if(!movies.length){

        if(currentPage === 1){

            movieGrid.innerHTML = `
                <div class="empty"
                     style="grid-column:1/-1">

                    <div class="empty-icon">🎬</div>

                    <h3>Tidak ada film ditemukan</h3>

                    <p>
                        Coba ubah filter atau kata pencarian.
                    </p>

                </div>
            `;

        }

        return;

    }


    movies.forEach(movie=>{

        currentResults.push(movie);

        const card =
            createMovieCard(movie);

        movieGrid.appendChild(card);

    });

}


/* =========================================================
   MOVIE CARD
========================================================= */

function createMovieCard(movie){

    const card =
        document.createElement("div");

    card.className =
        "movie-card";

    card.onclick =
        ()=>openMovie(movie.id);

    const poster =
        movie.poster_path
            ? IMAGE_BASE + movie.poster_path
            : placeholderPoster(movie.title);


    const year =
        movie.release_date
            ? movie.release_date.substring(0,4)
            : "—";


    const rating =
        movie.vote_average
            ? movie.vote_average.toFixed(1)
            : "—";


    card.innerHTML = `

        <div class="poster-wrap">

            <img
                class="poster"
                src="${poster}"
                alt="${escapeHTML(movie.title)}"
                loading="lazy"
            >

            <div class="rating">
                ⭐ ${rating}
            </div>

        </div>

        <div class="movie-info">

            <div class="movie-title">
                ${escapeHTML(movie.title)}
            </div>

            <div class="movie-year">
                ${year}
            </div>

        </div>
    `;

    return card;

}


/* =========================================================
   RESULT INFO
========================================================= */

function updateResultInfo(total){

    if(!total){

        resultInfo.textContent = "";

        return;

    }

    resultInfo.textContent =
        total.toLocaleString("id-ID") +
        " hasil";

}


/* =========================================================
   FILTER CHANGE
========================================================= */

genreFilter.addEventListener(
    "change",
    applyFilters
);

yearFilter.addEventListener(
    "change",
    applyFilters
);

ratingFilter.addEventListener(
    "change",
    applyFilters
);

sortFilter.addEventListener(
    "change",
    applyFilters
);


async function applyFilters(){

    preview.classList.remove("show");

    /*
       Filter selalu memulai kembali
       dari halaman 1.

       TMDB yang melakukan filtering.
    */

    currentMode =
        "discover";

    currentQuery =
        "";

    currentPage =
        0;

    totalPages =
        1;

    currentResults =
        [];

    movieGrid.innerHTML = "";

    sectionTitle.textContent =
        buildFilterTitle();

    resultInfo.textContent = "";

    await loadNextPage();

}


/* =========================================================
   FILTER TITLE
========================================================= */

function buildFilterTitle(){

    const parts = [];

    if(genreFilter.value){

        parts.push(
            genreFilter.options[
                genreFilter.selectedIndex
            ].text.replace("🎭 ","")
        );

    }

    if(yearFilter.value){

        parts.push(
            yearFilter.value
        );

    }

    if(ratingFilter.value){

        parts.push(
            "⭐ " +
            ratingFilter.value +
            "+"
        );

    }

    if(!parts.length){

        return "Film Populer";

    }

    return parts.join(" • ");

}


/* =========================================================
   RESET FILTERS
========================================================= */

async function resetFilters(){

    genreFilter.value = "";

    yearFilter.value = "";

    ratingFilter.value = "";

    sortFilter.value =
        "popularity.desc";

    searchInput.value = "";

    clearBtn.style.display =
        "none";

    preview.classList.remove("show");

    await startDiscover();

}


/* =========================================================
   LIVE SEARCH PREVIEW
========================================================= */

let previewTimer;

searchInput.addEventListener(
    "input",
    ()=>{

        clearTimeout(previewTimer);

        const query =
            searchInput.value.trim();

        clearBtn.style.display =
            query ? "block" : "none";

        if(!query){

            preview.classList.remove(
                "show"
            );

            return;

        }

        previewTimer =
            setTimeout(
                ()=>loadPreview(query),
                350
            );

    }
);


async function loadPreview(query){

    if(!apiKey) return;

    try{

        const data =
            await tmdb(
                "/search/movie",
                {
                    query:query,
                    language:"id-ID",
                    include_adult:false,
                    page:1
                }
            );

        const results =
            (data.results || [])
            .slice(0,7);


        if(!results.length){

            preview.innerHTML = `
                <div style="
                    padding:16px;
                    color:#777f90;
                ">
                    Film tidak ditemukan
                </div>
            `;

            preview.classList.add("show");

            return;

        }


        preview.innerHTML = "";

        results.forEach(movie=>{

            const item =
                document.createElement("div");

            item.className =
                "preview-item";

            const poster =
                movie.poster_path
                    ? IMAGE_BASE +
                      movie.poster_path
                    : placeholderPoster(
                        movie.title
                    );

            const year =
                movie.release_date
                    ? movie.release_date
                      .substring(0,4)
                    : "—";


            item.innerHTML = `

                <img
                    src="${poster}"
                    alt=""
                >

                <div class="preview-info">

                    <div class="preview-title">
                        ${escapeHTML(movie.title)}
                    </div>

                    <div class="preview-meta">
                        ${year}
                        •
                        ⭐ ${
                            movie.vote_average
                                ? movie.vote_average.toFixed(1)
                                : "—"
                        }
                    </div>

                </div>
            `;


            item.onclick =
                ()=>{
                    preview.classList.remove(
                        "show"
                    );

                    openMovie(movie.id);
                };


            preview.appendChild(item);

        });


        preview.classList.add("show");

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   CLEAR SEARCH
========================================================= */

async function clearSearch(){

    searchInput.value = "";

    clearBtn.style.display =
        "none";

    preview.classList.remove(
        "show"
    );

    await startDiscover();

}


/* =========================================================
   ENTER SEARCH
========================================================= */

searchInput.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Enter"){

            performSearch();

        }

        if(event.key === "Escape"){

            preview.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   MOVIE DETAIL
========================================================= */

async function openMovie(id){

    if(!apiKey){

        openSettings();

        return;

    }

    const modal =
        document.getElementById(
            "movieModal"
        );

    const detail =
        document.getElementById(
            "movieDetail"
        );

    modal.classList.add("show");

    detail.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <span>Memuat detail...</span>
        </div>
    `;


    try{

        const movie =
            await tmdb(
                "/movie/" + id,
                {
                    language:"id-ID",
                    append_to_response:
                        "credits"
                }
            );


        const poster =
            movie.poster_path
                ? IMAGE_BASE +
                  movie.poster_path
                : placeholderPoster(
                    movie.title
                );


        const genres =
            movie.genres || [];


        const director =
            movie.credits &&
            movie.credits.crew
                ? movie.credits.crew.find(
                    person =>
                        person.job ===
                        "Director"
                )
                : null;


        const cast =
            movie.credits &&
            movie.credits.cast
                ? movie.credits.cast
                    .slice(0,8)
                    .map(
                        person =>
                            person.name
                    )
                    .join(", ")
                : "—";


        const releaseYear =
            movie.release_date
                ? movie.release_date.substring(0,4)
                : "—";


        const runtime =
            movie.runtime
                ? movie.runtime +
                  " menit"
                : "—";


        detail.innerHTML = `

            <div class="detail">

                <div>

                    <img
                        class="detail-poster"
                        src="${poster}"
                        alt="${escapeHTML(movie.title)}"
                    >

                </div>

                <div class="detail-content">

                    <h2>
                        ${escapeHTML(movie.title)}
                    </h2>

                    ${
                        movie.original_title &&
                        movie.original_title !== movie.title
                        ? `
                            <div class="detail-meta">
                                ${escapeHTML(
                                    movie.original_title
                                )}
                            </div>
                        `
                        : ""
                    }

                    <div class="detail-meta">

                        ${releaseYear}
                        •
                        ⭐ ${
                            movie.vote_average
                                ? movie.vote_average.toFixed(1)
                                : "—"
                        }
                        •
                        ${runtime}

                    </div>


                    <div class="genres">

                        ${
                            genres.map(
                                genre =>
                                `<span class="genre">
                                    ${escapeHTML(
                                        genre.name
                                    )}
                                </span>`
                            ).join("")
                        }

                    </div>


                    <p class="overview">

                        ${
                            movie.overview ||
                            "Tidak ada sinopsis."
                        }

                    </p>


                    <div class="info-list">

                        <div class="info-box">

                            <div class="info-label">
                                Director
                            </div>

                            <div class="info-value">
                                ${
                                    director
                                        ? escapeHTML(
                                            director.name
                                          )
                                        : "—"
                                }
                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                Bahasa
                            </div>

                            <div class="info-value">
                                ${
                                    movie.original_language
                                        ? movie.original_language
                                            .toUpperCase()
                                        : "—"
                                }
                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                Vote
                            </div>

                            <div class="info-value">
                                ${
                                    movie.vote_count
                                        ? movie.vote_count
                                            .toLocaleString(
                                                "id-ID"
                                            )
                                        : "—"
                                }
                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                Pemeran
                            </div>

                            <div class="info-value">
                                ${escapeHTML(cast)}
                            </div>

                        </div>

                    </div>

                </div>

            </div>
        `;


    }catch(error){

        detail.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <h3>Gagal memuat detail</h3>
                <p>${escapeHTML(error.message)}</p>
            </div>
        `;

    }

}


function closeMovieModal(){

    document
        .getElementById("movieModal")
        .classList.remove("show");

}


function closeModalOutside(event){

    if(
        event.target.id ===
        "movieModal"
    ){

        closeMovieModal();

    }

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

    document
        .getElementById(
            "settingsModal"
        )
        .classList.add("show");

    document
        .getElementById(
            "apiInput"
        ).value = apiKey;

}


function closeSettings(){

    document
        .getElementById(
            "settingsModal"
        )
        .classList.remove("show");

}


async function saveAPI(){

    const value =
        document
            .getElementById(
                "apiInput"
            )
            .value.trim();

    if(!value){

        showToast(
            "Masukkan API terlebih dahulu."
        );

        return;

    }


    apiKey =
        value;

    localStorage.setItem(
        API_STORAGE,
        apiKey
    );


    closeSettings();

    showToast(
        "API berhasil disimpan."
    );


    /*
       Reload genre agar genre
       tersedia setelah API baru dimasukkan.
    */

    genreFilter.innerHTML =
        `<option value="">
            🎭 Semua Genre
        </option>`;

    await loadGenres();

    await startDiscover();

}


function deleteAPI(){

    localStorage.removeItem(
        API_STORAGE
    );

    apiKey = "";

    closeSettings();

    movieGrid.innerHTML = `
        <div class="empty"
             style="grid-column:1/-1">

            <div class="empty-icon">🔑</div>

            <h3>API belum diatur</h3>

            <p>
                Masukkan TMDB API melalui
                tombol ⚙️.
            </p>

        </div>
    `;

    showToast(
        "API dihapus dari perangkat."
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            3000
        );

}


/* =========================================================
   INFINITE SCROLL
========================================================= */

const observer =
    new IntersectionObserver(
        entries=>{

            if(!entries[0].isIntersecting)
                return;

            if(
                currentMode ===
                "search"
            ){

                loadNextSearchPage();

            }else{

                loadNextPage();

            }

        },
        {
            root:null,
            rootMargin:"700px",
            threshold:0
        }
    );


observer.observe(
    loadMoreTrigger
);


/* =========================================================
   CLOSE PREVIEW
========================================================= */

document.addEventListener(
    "click",
    event=>{

        const area =
            document.querySelector(
                ".search-area"
            );

        if(
            area &&
            !area.contains(event.target)
        ){

            preview.classList.remove(
                "show"
            );

        }

    }
);

   INITIALIZATION

                 style="grid-column:1/-1">

                <div class="empty-icon">
                    🎬
                </div>

                <h3>
                    Selamat datang di Movie Finder
                </h3>

                <p>
                    Masukkan TMDB API melalui
                    tombol ⚙️ untuk mulai mencari film.
                </p>

            </div>
        `;

        return;

    }


    await loadGenres();

    await startDiscover();

}


init();

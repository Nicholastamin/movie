<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Trailer • Movie Finder</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

button{
    font:inherit;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    border-bottom:1px solid #e3e7ef;
}

.header-inner{
    max-width:1400px;
    margin:auto;
    min-height:70px;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#2859e6;
    font-weight:900;
    font-size:21px;
}

.logo-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,#4169ff,#7655ff);
    display:grid;
    place-items:center;
    color:#fff;
}

.back-btn{
    border:0;
    background:#eef2f8;
    color:#3d4960;
    border-radius:11px;
    padding:10px 15px;
    font-weight:800;
}

.back-btn:hover{
    background:#e4ebff;
    color:#2859e6;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1250px;
    margin:auto;
    padding:30px 20px 60px;
}

.page-title{
    margin:0 0 8px;
    font-size:clamp(27px,5vw,42px);
}

.page-subtitle{
    margin:0 0 25px;
    color:#6d778b;
}

/* =========================
   MOVIE HEADER
========================= */

.movie-header{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:25px;
    padding:25px;
    background:#fff;
    border:1px solid #e1e6ef;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(25,40,70,.06);
    margin-bottom:25px;
}

.poster{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:15px;
    background:#edf0f5;
}

.movie-info h2{
    margin:0 0 8px;
    font-size:30px;
}

.meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:12px 0 15px;
}

.meta span{
    background:#f0f3f8;
    color:#4b566b;
    padding:7px 10px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
}

.overview{
    color:#596479;
    line-height:1.65;
    margin:0;
}

/* =========================
   VIDEO
========================= */

.video-card{
    background:white;
    border:1px solid #e1e6ef;
    border-radius:22px;
    padding:20px;
    box-shadow:0 10px 35px rgba(25,40,70,.06);
    margin-bottom:25px;
}

.video-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.video-title h2{
    margin:0;
    font-size:21px;
}

.youtube-link{
    background:#fff0f0;
    color:#d63f4e;
    padding:8px 11px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
}

.video-frame{
    width:100%;
    aspect-ratio:16/9;
    border:0;
    border-radius:15px;
    display:block;
    background:#edf0f5;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}

.video-item{
    background:#fff;
    border:1px solid #e1e6ef;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(25,40,70,.05);
}

.video-thumb{
    position:relative;
    aspect-ratio:16/9;
    background:#edf0f5;
    overflow:hidden;
}

.video-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.play{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:40px;
    background:rgba(20,25,40,.08);
}

.video-item-info{
    padding:12px;
}

.video-item-info h3{
    margin:0 0 5px;
    font-size:14px;
    line-height:1.4;
}

.video-item-info p{
    margin:0;
    color:#7a8497;
    font-size:12px;
}

.watch-btn{
    width:100%;
    margin-top:10px;
    border:0;
    border-radius:9px;
    padding:9px;
    background:#edf2ff;
    color:#315bd9;
    font-weight:800;
}

/* =========================
   EMPTY / LOADING
========================= */

.center{
    text-align:center;
    padding:80px 20px;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #dfe5ef;
    border-top-color:#4169ff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error-box{
    background:#fff;
    border:1px solid #f0d8dc;
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.error-box button{
    border:0;
    background:#4169ff;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    font-weight:800;
    margin-top:10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translate(-50%,20px);
    background:#172033;
    color:#fff;
    padding:12px 17px;
    border-radius:11px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:3000;
    text-align:center;
    max-width:calc(100% - 30px);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .video-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}

@media(max-width:600px){

    .header-inner{
        padding:9px 14px;
    }

    .logo{
        font-size:17px;
    }

    .logo-icon{
        width:36px;
        height:36px;
    }

    .back-btn{
        padding:8px 10px;
        font-size:12px;
    }

    .container{
        padding:20px 14px 45px;
    }

    .movie-header{
        grid-template-columns:105px 1fr;
        gap:15px;
        padding:17px;
        border-radius:18px;
    }

    .movie-info h2{
        font-size:20px;
    }

    .overview{
        grid-column:1/-1;
        font-size:14px;
    }

    .video-card{
        padding:13px;
        border-radius:17px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

    .video-title{
        align-items:flex-start;
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo">
            <div class="logo-icon">🎬</div>
            Movie Finder
        </div>

        <button class="back-btn" onclick="goBack()">
            ← Kembali
        </button>

    </div>

</header>

<main class="container">

    <h1 class="page-title">
        🎞️ Trailer Film
    </h1>

    <p class="page-subtitle">
        Trailer dan video resmi dari film yang dipilih.
    </p>

    <div id="app">

        <div class="center">

            <div class="spinner"></div>

            <div>Memuat trailer...</div>

        </div>

    </div>

</main>

<div id="toast" class="toast"></div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const TMDB_BASE =
    "https://api.themoviedb.org/3";

const IMG =
    "https://image.tmdb.org/t/p/w500";

const STORAGE_API =
    "movie_finder_tmdb_key";

const apiKey =
    localStorage.getItem(STORAGE_API) || "";

/* ============================================================
   MOVIE ID
============================================================ */

const params =
    new URLSearchParams(location.search);

const movieId =
    params.get("id");

/* ============================================================
   API
============================================================ */

async function api(path,params={}){

    if(!apiKey){

        throw new Error(
            "API belum tersimpan. Kembali ke halaman utama dan atur API."
        );

    }

    const url =
        new URL(TMDB_BASE + path);

    Object.entries(params).forEach(([key,value])=>{

        if(
            value !== undefined &&
            value !== null &&
            value !== ""
        ){

            url.searchParams.set(key,value);

        }

    });

    const options = {

        method:"GET",

        headers:{
            accept:"application/json"
        }

    };

    if(apiKey.startsWith("eyJ")){

        options.headers.Authorization =
            "Bearer " + apiKey;

    }else{

        url.searchParams.set(
            "api_key",
            apiKey
        );

    }

    const response =
        await fetch(
            url.toString(),
            options
        );

    if(!response.ok){

        throw new Error(
            "TMDB error " + response.status
        );

    }

    return response.json();

}

/* ============================================================
   ESCAPE
============================================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ============================================================
   FIND BEST TRAILER
============================================================ */

function findBestTrailer(videos){

    const youtube =
        videos.filter(
            video => video.site === "YouTube"
        );

    if(!youtube.length){

        return null;

    }

    return (

        youtube.find(
            video =>
                video.type === "Trailer" &&
                video.official === true
        )

        ||

        youtube.find(
            video =>
                video.type === "Trailer"
        )

        ||

        youtube.find(
            video =>
                video.type === "Teaser"
        )

        ||

        youtube[0]

    );

}

/* ============================================================
   LOAD MOVIE
============================================================ */

async function loadMovie(){

    if(!movieId){

        showError(
            "ID film tidak ditemukan.",
            "Buka trailer dari tombol Trailer pada kartu film."
        );

        return;

    }

    if(!apiKey){

        showError(
            "API belum tersimpan.",
            "Kembali ke index.html lalu masukkan API TMDB."
        );

        return;

    }

    try{

        const movie =
            await api(
                `/movie/${movieId}`,
                {
                    language:"id-ID",
                    append_to_response:"videos"
                }
            );

        renderMovie(movie);

    }catch(error){

        console.error(error);

        showError(
            "Film tidak dapat dimuat.",
            "Periksa API atau coba kembali dari halaman utama."
        );

    }

}

/* ============================================================
   RENDER MOVIE
============================================================ */

function renderMovie(movie){

    const videos =
        movie.videos?.results || [];

    const youtube =
        videos.filter(
            video => video.site === "YouTube"
        );

    const mainTrailer =
        findBestTrailer(videos);

    let html = "";

    /* =========================
       MOVIE HEADER
    ========================= */

    html += `

        <section class="movie-header">

            ${
                movie.poster_path
                ? `
                    <img
                        class="poster"
                        src="${IMG}${movie.poster_path}"
                        alt="${escapeHTML(movie.title)}">
                  `
                :
                  `
                    <div
                        class="poster"
                        style="
                            display:grid;
                            place-items:center;
                            color:#8791a4;
                        ">
                        No Poster
                    </div>
                  `
            }

            <div class="movie-info">

                <h2>
                    ${escapeHTML(movie.title || "Tanpa judul")}
                </h2>

                <div class="meta">

                    <span>
                        ⭐ ${Number(
                            movie.vote_average || 0
                        ).toFixed(1)}
                    </span>

                    <span>
                        📅 ${
                            movie.release_date || "—"
                        }
                    </span>

                    <span>
                        ⏱️ ${
                            movie.runtime
                            ? movie.runtime + " menit"
                            : "—"
                        }
                    </span>

                </div>

                <p class="overview">

                    ${
                        escapeHTML(
                            movie.overview ||
                            "Tidak ada sinopsis."
                        )
                    }

                </p>

            </div>

        </section>

    `;

    /* =========================
       MAIN TRAILER
    ========================= */

    if(mainTrailer){

        html += `

            <section class="video-card">

                <div class="video-title">

                    <h2>
                        ▶ Trailer Utama
                    </h2>

                    <a
                        class="youtube-link"
                        href="https://www.youtube.com/watch?v=${encodeURIComponent(mainTrailer.key)}"
                        target="_blank"
                        rel="noopener">
                        Buka YouTube ↗
                    </a>

                </div>

                <iframe
                    class="video-frame"
                    src="https://www.youtube.com/embed/${encodeURIComponent(mainTrailer.key)}"
                    title="${escapeHTML(mainTrailer.name || "Trailer")}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </section>

        `;

    }else{

        html += `

            <section class="video-card">

                <div class="center">

                    <div style="font-size:45px">
                        🎞️
                    </div>

                    <h3>
                        Trailer tidak tersedia
                    </h3>

                    <p style="color:#778196">
                        TMDB tidak menyediakan video YouTube
                        untuk film ini.
                    </p>

                </div>

            </section>

        `;

    }

    /* =========================
       ALL VIDEOS
    ========================= */

    const otherVideos =
        youtube.filter(
            video =>
                !mainTrailer ||
                video.id !== mainTrailer.id
        );

    if(otherVideos.length){

        html += `

            <section>

                <div class="video-title">

                    <h2>
                        🎬 Video Lain
                    </h2>

                </div>

                <div class="video-grid">

                    ${
                        otherVideos
                        .map(renderVideo)
                        .join("")
                    }

                </div>

            </section>

        `;

    }

    document.getElementById("app")
        .innerHTML = html;

}

/* ============================================================
   RENDER VIDEO
============================================================ */

function renderVideo(video){

    const thumbnail =
        `https://i.ytimg.com/vi/${encodeURIComponent(video.key)}/hqdefault.jpg`;

    return `

        <article class="video-item">

            <div class="video-thumb">

                <img
                    src="${thumbnail}"
                    loading="lazy"
                    alt="${escapeHTML(video.name || "")}">

                <div class="play">
                    ▶️
                </div>

            </div>

            <div class="video-item-info">

                <h3>
                    ${escapeHTML(
                        video.name || "Video"
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        video.type || "Video"
                    )}
                    ${
                        video.official
                        ? " · Resmi"
                        : ""
                    }
                </p>

                <button
                    class="watch-btn"
                    onclick="playVideo('${escapeJS(video.key)}')">
                    ▶ Tonton
                </button>

            </div>

        </article>

    `;

}

/* ============================================================
   PLAY OTHER VIDEO
============================================================ */

function playVideo(key){

    const existing =
        document.getElementById("playerModal");

    if(existing){

        existing.remove();

    }

    const modal =
        document.createElement("div");

    modal.id = "playerModal";

    modal.style.cssText = `
        position:fixed;
        inset:0;
        z-index:5000;
        background:rgba(15,20,35,.72);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:15px;
    `;

    modal.innerHTML = `

        <div style="
            width:min(950px,100%);
            background:#fff;
            border-radius:18px;
            padding:15px;
            position:relative;
        ">

            <button
                onclick="document.getElementById('playerModal').remove()"
                style="
                    position:absolute;
                    right:10px;
                    top:10px;
                    z-index:5;
                    width:38px;
                    height:38px;
                    border:0;
                    border-radius:50%;
                    background:#fff;
                    font-size:22px;
                    cursor:pointer;
                ">
                ×
            </button>

            <iframe
                src="https://www.youtube.com/embed/${encodeURIComponent(key)}"
                style="
                    width:100%;
                    aspect-ratio:16/9;
                    border:0;
                    border-radius:12px;
                    display:block;
                "
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    `;

    document.body.appendChild(modal);

}

/* ============================================================
   ESCAPE JS
============================================================ */

function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}

/* ============================================================
   ERROR
============================================================ */

function showError(title,message){

    document.getElementById("app")
        .innerHTML = `

            <div class="error-box">

                <div style="font-size:45px">
                    ⚠️
                </div>

                <h2>
                    ${escapeHTML(title)}
                </h2>

                <p>
                    ${escapeHTML(message)}
                </p>

                <button onclick="goBack()">
                    ← Kembali ke Movie Finder
                </button>

            </div>

        `;

}

/* ============================================================
   BACK
============================================================ */

function goBack(){

    if(document.referrer){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}

/* ============================================================
   TOAST
============================================================ */

let toastTimer;

function toast(message){

    const element =
        document.getElementById("toast");

    element.textContent = message;

    element.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>element.classList.remove("show"),
            2500
        );

}

/* ============================================================
   ESC KEY
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            const modal =
                document.getElementById(
                    "playerModal"
                );

            if(modal){

                modal.remove();

            }

        }

    }
);

/* ============================================================
   START
============================================================ */

loadMovie();

</script>

</body>
</html>
